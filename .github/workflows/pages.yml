name: Сборка и публикация Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получение проекта
        uses: actions/checkout@v4

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Загрузка зависимостей
        run: flutter pub get

      - name: Проверка адреса API
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: test -n "$API_BASE_URL"

      - name: Проверка проекта
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Релизная сборка
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          flutter build web --release \
            --base-href /UP_flutter_final/ \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          cp build/web/index.html build/web/404.html

      - name: Подготовка GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузка файлов сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
